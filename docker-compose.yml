version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maarif_postgres
    restart: always
    environment:
      POSTGRES_USER: maarif_user
      POSTGRES_PASSWORD: maarif_password123
      POSTGRES_DB: maarif_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maarif_user -d maarif_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # İsteğe bağlı görsel veritabanı yönetim arayüzü (http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: maarif_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@maarif.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
